<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lente Inteligente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Lente Inteligente</h1>
        <p>Capture imagens e aplique filtros em tempo real.</p>

        <!-- Visualização da câmera -->
        <video id="camera" autoplay playsinline muted></video>

        <!-- Controle da câmera -->
        <div class="controles">
            <button id="iniciar">Iniciar câmera</button>
            <button id="alternar">Alternar câmera</button>
            <button id="desligar">Desligar câmera</button>
        </div>

        <!-- Seleção de filtros -->
        <div class="filtros">
            <button id="normal">Normal</button>
            <button id="grayscale">Grayscale</button>
            <button id="sepia">Sepia</button>
        </div>

        <!-- Captura da fotografia -->
        <button id="capturar">Capturar foto</button>

        <!-- Resultado da captura -->
        <h2>Foto capturada</h2>

        <canvas id="canvas" hidden></canvas>

        <button id="baixar" disabled>Baixar foto</button>

    </main>

    <script src="script.js"></script>

</body>
</html>
